<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>新人旅程 Onboarding Journey</title>
<!-- V11 上鎖外殼（沿用 V9／V10／V10.1，新增簡體中文）：遊戲本體已加密，輸入旅程密碼後才在這台裝置上解密。檔案內不含密碼本身。 -->
<style>
html,body{margin:0;height:100%}
#lock{position:fixed;inset:0;z-index:2147483000;overflow:hidden;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Segoe UI",sans-serif;color:#3E4270;
  background:linear-gradient(180deg,#FCE4D8 0%,#F6DDEA 46%,#D6E2F5 100%);transition:opacity .8s ease;-webkit-tap-highlight-color:transparent}
#lock.out{opacity:0;pointer-events:none}
#lk{position:absolute;inset:0;width:100%;height:100%}
#lkLang{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;display:flex;gap:2px;border-radius:999px;background:rgba(255,255,255,.85);padding:3px;box-shadow:0 6px 18px -10px rgba(40,42,74,.5)}
#lkLang button{border:0;border-radius:999px;background:transparent;color:#6B6890;font-weight:800;font-size:13px;font-family:inherit;padding:6px 11px;cursor:pointer;white-space:nowrap}
#lkLang button.on{background:#3E4270;color:#fff}
html[lang="zh-Hans"] #lock{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","PingFang TC","Microsoft JhengHei","Segoe UI",sans-serif}
.lk-p{position:absolute;left:50%;bottom:max(6vh,24px);transform:translateX(-50%);width:min(380px,calc(100% - 32px));text-align:center;transition:opacity .35s,transform .35s}
.lk-p.hide{opacity:0;transform:translate(-50%,10px);pointer-events:none}
.lk-logo{width:78px;height:20px;margin:0 auto 10px;background:#EE3942;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.lk-p h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.24em;text-indent:.24em}
.lk-en{font-size:11.5px;font-weight:700;letter-spacing:.32em;text-indent:.32em;color:#8E87A8;margin:4px 0 12px}
.lk-bu{display:inline-block;margin:-4px 0 12px;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.7);font-size:13px;font-weight:700;color:#5B5880}.lk-bu:empty{display:none}
#lkSub{margin:0 0 14px;font-size:15px;font-weight:600;color:#6B6890}
#lkForm{display:flex;gap:8px;background:rgba(255,255,255,.92);border-radius:16px;padding:6px;box-shadow:0 16px 36px -20px rgba(40,42,74,.6)}
#lkPw{flex:1;min-width:0;border:0;outline:0;background:transparent;font-weight:600;font-size:17px;font-family:inherit;color:#3E4270;padding:10px 12px;letter-spacing:.04em}
#lkPw::placeholder{color:#B4AEC9;letter-spacing:0}
#lkGo{border:0;border-radius:12px;background:#3E4270;color:#fff;font-weight:800;font-size:15px;font-family:inherit;padding:0 20px;cursor:pointer;min-height:44px}
#lkGo:disabled{opacity:.55;cursor:default}
#lkForm.shake{animation:lkShake .42s}
@keyframes lkShake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.lk-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;font-weight:600;color:#8E87A8}
.lk-row{flex-wrap:wrap;gap:4px 14px;line-height:1.45}
.lk-row label{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;flex:none}
.lk-row>span{margin-left:auto;text-align:right}
#lkMsg{min-height:22px;margin-top:10px;font-size:14px;font-weight:700;line-height:1.5;color:#C0505A}
#lkMsg.ok{color:#2F8F86}
.lk-ver{margin-top:2px;font-size:11px;font-weight:600;color:#A9A3C0;letter-spacing:.04em}.lk-ver:empty{display:none}
#lkHello{position:absolute;left:0;right:0;bottom:max(12vh,60px);text-align:center;opacity:0;transition:opacity .5s;pointer-events:none}
#lkHello.on{opacity:1}
#lkHello b{display:block;font-size:24px;letter-spacing:.12em;text-indent:.12em}
#lkHello span{display:block;margin-top:8px;font-size:13.5px;font-weight:600;color:#6B6890}
@media (max-height:520px) and (min-aspect-ratio:4/3){.lk-p{left:auto;right:4%;bottom:auto;top:50%;transform:translateY(-50%);width:min(360px,46%)}.lk-p.hide{transform:translate(10px,-50%)}#lkHello{left:0;right:auto;width:54%;bottom:12%}}
@media (max-height:640px){.lk-p h1{font-size:24px}.lk-en{margin-bottom:8px}#lkSub{margin-bottom:10px}}
</style>
</head>
<body>
<div id="lock">
  <canvas id="lk" aria-hidden="true"></canvas>
  <div id="lkLang" role="group" aria-label="Language"><button type="button" data-l="zh" lang="zh-Hant">繁中</button><button type="button" data-l="cn" lang="zh-Hans">简中</button><button type="button" data-l="en" lang="en">EN</button></div>
  <div class="lk-p" id="lkP">
    <div class="lk-logo" aria-label="Molex"></div>
    <h1 data-t="title"></h1><div class="lk-en">ONBOARDING JOURNEY</div><div class="lk-bu" id="lkBu"></div>
    <p id="lkSub" data-t="sub"></p>
    <form id="lkForm" autocomplete="off"><input id="lkPw" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go"><button id="lkGo" type="submit" data-t="go"></button></form>
    <div class="lk-row"><label><input type="checkbox" id="lkShow"><span data-t="show"></span></label><span data-t="help"></span></div>
    <div id="lkMsg" role="status" aria-live="polite"></div>
    <div class="lk-ver" id="lkVer"></div>
  </div>
  <div id="lkHello"><b id="lkHelloB"></b><span id="lkHelloS"></span></div>
</div>

  if (A.sparkT > 0 && t - A.sparkT < .7) { const f = (t - A.sparkT) / .7, [sx, sy] = P(.58, PY + .06, 1); g.strokeStyle = `rgba(238,57,66,${1 - f})`; g.lineWidth = Math.max(2, SCL * .035); g.lineCap = 'round'; for (let i = 0; i < 8; i++) { const an = i / 8 * Math.PI * 2 + .2, r0 = SCL * (.22 + f * .25), r1 = r0 + SCL * .14; g.beginPath(); g.moveTo(sx + Math.cos(an) * r0, sy + Math.sin(an) * r0 * .7); g.lineTo(sx + Math.cos(an) * r1, sy + Math.sin(an) * r1 * .7); g.stroke(); } }

}
requestAnimationFrame(frame);

/* ---------- 音效（短、輕） ---------- */
let AC = null; const ac = () => { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) try { AC = new C(); } catch (e) { } } if (AC && AC.state === 'suspended') AC.resume(); return AC; };
function tone(f, t0, d, type = 'sine', v = .05) { const c = AC, o = c.createOscillator(), gg = c.createGain(); o.type = type; o.frequency.value = f; gg.gain.setValueAtTime(0, t0); gg.gain.linearRampToValueAtTime(v, t0 + .008); gg.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(gg); gg.connect(c.destination); o.start(t0); o.stop(t0 + d + .05); }
const snd = {
  click() { if (!AC) return; const t0 = AC.currentTime + .01; tone(2400, t0, .05, 'square', .03); tone(1650, t0 + .05, .06, 'square', .03); tone(98, t0, .35, 'sine', .12); },
  flow() { if (!AC) return; const c = AC, t0 = c.currentTime + .01, n = c.createBufferSource(), b = c.createBuffer(1, c.sampleRate * 1.4, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; n.buffer = b; const bp = c.createBiquadFilter(), gg = c.createGain(); bp.type = 'bandpass'; bp.frequency.setValueAtTime(500, t0); bp.frequency.linearRampToValueAtTime(1900, t0 + 1.2); gg.gain.setValueAtTime(0, t0); gg.gain.linearRampToValueAtTime(.045, t0 + .3); gg.gain.linearRampToValueAtTime(0, t0 + 1.35); n.connect(bp); bp.connect(gg); gg.connect(c.destination); n.start(t0); [783.99, 987.77, 1174.66, 1567.98].forEach((f, i) => tone(f, t0 + 1.15 + i * .1, 1.4, 'sine', .05)); },
  nope() { if (!AC) return; const t0 = AC.currentTime + .01; tone(330, t0, .25, 'triangle', .04); tone(262, t0 + .12, .35, 'triangle', .04); }
};

/* =====================================================================
   解鎖流程
   ===================================================================== */
let busy = false;
function failWait() { const f = LS.get(K + 'fail') || { n: 0, t: 0 }; return f.n >= 5 ? Math.max(0, Math.ceil((f.t + 30000 - Date.now()) / 1000)) : 0; }
function tickWait() { const s = failWait(); if (s > 0) { say('wait', { s }); $('lkGo').disabled = true; setTimeout(tickWait, 1000); } else { $('lkGo').disabled = false; if (msgKey === 'wait') { LS.set(K + 'fail', { n: 0, t: 0 }); say(null); } } }
function wrong(k, v) { A.phase = 'wrong'; A.wrongT = A.t; snd.nope(); say(k, v); const f = $('lkForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }
$('lkForm').onsubmit = async e => {
  e.preventDefault(); if (busy || failWait()) return; const pw = $('lkPw').value; if (!norm(pw)) return wrong('empty');
  ac(); busy = true; $('lkGo').disabled = true; say('check', {}, true); A.phase = 'check'; const t0 = performance.now();
  let slot = null; try { slot = await trySlots(pw); } catch (err) { slot = null; }
  await new Promise(r => setTimeout(r, Math.max(0, 700 - (performance.now() - t0)))); // 讓插頭靠近的動作看得到
  busy = false; $('lkGo').disabled = false;
  if (!slot) { const f = LS.get(K + 'fail') || { n: 0, t: 0 }; f.n++; f.t = Date.now(); LS.set(K + 'fail', f); if (f.n >= 5) { A.phase = 'wrong'; A.wrongT = A.t; snd.nope(); return tickWait(); } return wrong('wrong'); }
  const c = check(slot); if (c.err) return wrong(c.err, c.v);
  let game = null; try { game = await openGame(slot.m); } catch (err) { } if (!game) return wrong('broken');
  const first = LS.get(K + 'first') || {}; if (!first[slot.id]) { first[slot.id] = c.now; LS.set(K + 'first', first); }
  const until = Math.min(c.now + slot.rd * DAY, c.lim, slot.e || Infinity);
  LS.set(K + 'auth', { b: VAULT.b, m: slot.m, id: slot.id, s: slot.s, e: slot.e, vd: slot.vd, until, k: slot.dk, salt: VAULT.salt }); LS.del(K + 'fail');
  success(game, 'ok', Math.min(c.lim, slot.e || Infinity));
};
function success(game, hello, lim) {
  A.phase = 'ok'; say(null); $('lkP').classList.add('hide'); $('lkPw').blur();
  $('lkHelloB').textContent = T(hello); $('lkHelloS').textContent = T('until', { d: fmtD(lim) });
  const showT = hello === 'ok' ? 900 : 300, bootT = hello === 'ok' ? 2350 : 1500;
  setTimeout(() => $('lkHello').classList.add('on'), showT);
  setTimeout(() => { $('lkHello').classList.remove('on'); boot(game); const z0 = performance.now(); (function zm() { A.zoom = Math.min(1, (performance.now() - z0) / 900); if (A.zoom < 1) requestAnimationFrame(zm); })(); lockEl.classList.add('out'); setTimeout(() => lockEl.remove(), 950); }, bootT);
}
function boot(game) {
  const s = document.createElement('style'); s.textContent = game.css; document.head.appendChild(s);
  const box = document.createElement('div'); box.innerHTML = game.html; while (box.firstChild) document.body.insertBefore(box.firstChild, lockEl);
  if (game.title) document.title = game.title;
  const sc = document.createElement('script'); sc.textContent = game.js; document.body.appendChild(sc);
}
// 這台裝置記住了解鎖（30 天內）→ 直接接上
// V10.1：HR 更新內容、重新產生檔案後，用記住的鑰匙打開新版本，不用再輸入密碼；
//        但如果 HR 在 Excel 停用了這組密碼，新版本就打不開，會回到上鎖畫面
(async () => {
  applyLang();
  if (!VAULT) return say('broken');
  const au = LS.get(K + 'auth');
  if (au && au.b !== VAULT.b && au.k && au.salt === VAULT.salt) {
    let sl = null; try { sl = await slotsWith(b64(au.k)); } catch (e) { }
    if (sl) {
      const first = LS.get(K + 'first') || {}; if (!first[sl.id] && first[au.id]) { first[sl.id] = first[au.id]; LS.set(K + 'first', first); } // Excel 的編號或梯次改了：沿用原本的第一次登入日
      Object.assign(au, { b: VAULT.b, m: sl.m, id: sl.id, s: sl.s, e: sl.e, vd: sl.vd }); LS.set(K + 'auth', au);
    }
  }
  if (au && au.b === VAULT.b) {
    const now = nowSafe(), first = (LS.get(K + 'first') || {})[au.id] || now;
    if (now < au.until && now >= (au.s || 0) && (!au.e || now <= au.e) && now <= first + au.vd * DAY) {
      let game = null; try { game = await openGame(au.m); } catch (e) { }
      if (game) { A.ins = 1; A.sparkT = A.t || .001; return success(game, 'back', Math.min(first + au.vd * DAY, au.e || Infinity)); }
    }
  }
  if (au) LS.del(K + 'auth');
  if (failWait()) tickWait();
  setTimeout(() => { try { $('lkPw').focus({ preventScroll: true }); } catch (e) { } }, 400);
})();
window.__lk = { A, norm, SUB, JS, geo: () => area() }; // 測試用
